# =============================================================================
# DVLD — Continuous Integration Pipeline (Azure Pipelines)
# Architecture:
#   Stage 1 (Frontend_CI): Node.js 26 Active LTS, npm cache, npm ci, npm audit
#                          report, ESLint, tsc -b, Vitest unit/component tests,
#                          Playwright Chromium installation & E2E tests, Vite
#                          production build, and frontend artifacts.
#   Stage 2 (Backend_CI):  .NET 10 SDK (from global.json), NuGet cache, Release
#                          solution restore, NuGet vulnerability audit & build,
#                          Application Unit Tests, dedicated run-specific SQL
#                          Server LocalDB readiness & ownership verification,
#                          API Integration Tests, Infrastructure Integration
#                          Tests, deduplicated Cobertura coverage staging &
#                          publishing, ownership-verified test-DB cleanup, and
#                          API release artifact packaging.
# Quality Gate:
#   Both stages and all automated test suites are mandatory on every triggered
#   CI / PR run. No mandatory step uses continueOnError or silent skipping.
# =============================================================================

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - API/**
      - Application/**
      - ClientApp/**
      - Domain/**
      - DVLD.Contracts/**
      - Infrastructure/**
      - Test/**
      - eng/**
      - scripts/**
      - '*.csproj'
      - '**/*.csproj'
      - azure-pipelines.yml
      - global.json
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
      - '**/Directory.Build.props'
      - '**/Directory.Build.targets'
      - '**/Directory.Packages.props'
      - NuGet.config
      - nuget.config
      - '**/NuGet.config'
      - '**/nuget.config'
      - .editorconfig
      - '**/.editorconfig'
      - .globalconfig
      - '**/.globalconfig'
      - '*.props'
      - '*.targets'
      - '*.config'
      - '*.json'
      - '*.sln'
      - '*.slnx'
      - '**/*.sln'
      - '**/*.slnx'
      - '*.runsettings'
      - '**/*.runsettings'
    exclude:
      - docs/**
      - README.md
      - AGENTS.md
      - ENGINEERING-ROADMAP.md
      - ENGINEERING-DECISIONS.md
      - ClientApp/README.md
      - ClientApp/AGENTS.md

pr:
  autoCancel: true
  branches:
    include:
      - main
  paths:
    include:
      - API/**
      - Application/**
      - ClientApp/**
      - Domain/**
      - DVLD.Contracts/**
      - Infrastructure/**
      - Test/**
      - eng/**
      - scripts/**
      - '*.csproj'
      - '**/*.csproj'
      - azure-pipelines.yml
      - global.json
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
      - '**/Directory.Build.props'
      - '**/Directory.Build.targets'
      - '**/Directory.Packages.props'
      - NuGet.config
      - nuget.config
      - '**/NuGet.config'
      - '**/nuget.config'
      - .editorconfig
      - '**/.editorconfig'
      - .globalconfig
      - '**/.globalconfig'
      - '*.props'
      - '*.targets'
      - '*.config'
      - '*.json'
      - '*.sln'
      - '*.slnx'
      - '**/*.sln'
      - '**/*.slnx'
      - '*.runsettings'
      - '**/*.runsettings'
    exclude:
      - docs/**
      - README.md
      - AGENTS.md
      - ENGINEERING-ROADMAP.md
      - ENGINEERING-DECISIONS.md
      - ClientApp/README.md
      - ClientApp/AGENTS.md

variables:
  vmImageName: 'windows-latest'
  buildConfiguration: 'Release'
  solutionPath: 'DVLD.sln'
  apiProjectPath: 'API/DVLD.Api/DVLD.Api.csproj'
  unitTestProject: 'Test/Application.UnitTests/Application.UnitTests.csproj'
  apiIntegrationTestProject: 'Test/API.IntegrationTests/API.IntegrationTests.csproj'
  infraIntegrationTestProject: 'Test/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj'
  nodeVersionSpec: '26.x'

stages:
  # ===========================================================================
  # STAGE 1: FRONTEND VALIDATION — ClientApp (React 19 + TypeScript 6 + Vite 8)
  # ===========================================================================
  - stage: Frontend_CI
    displayName: 'Frontend CI — ClientApp'
    dependsOn: []
    jobs:
      - job: Validate_ClientApp
        displayName: 'Lint, Test (Vitest & Playwright), Type-Check & Build ClientApp'
        timeoutInMinutes: 25
        cancelTimeoutInMinutes: 2
        pool:
          vmImage: $(vmImageName)
        variables:
          npm_config_cache: '$(Pipeline.Workspace)/.npm'
          frontendTestResultsDir: '$(Agent.TempDirectory)/FrontendTestResults'
        steps:
          - checkout: self
            clean: true
            fetchDepth: 1

          - task: UseNode@1
            displayName: 'Install Node.js $(nodeVersionSpec) Active LTS'
            inputs:
              version: '$(nodeVersionSpec)'

          - task: Cache@2
            displayName: 'Cache npm Packages'
            inputs:
              key: '"npm" | "$(Agent.OS)" | ClientApp/package-lock.json'
              restoreKeys: |
                "npm" | "$(Agent.OS)"
              path: '$(npm_config_cache)'

          - task: PowerShell@2
            displayName: 'Install ClientApp Dependencies (npm ci)'
            inputs:
              targetType: 'inline'
              workingDirectory: 'ClientApp'
              failOnStderr: false
              script: |
                $ErrorActionPreference = 'Stop'
                Write-Host "Node version: $(node --version)"
                Write-Host "npm version:  $(npm.cmd --version)"

                if (-not (Test-Path 'package-lock.json')) {
                  Write-Host "##vso[task.logissue type=error]ClientApp/package-lock.json is missing. Deterministic dependency installation cannot proceed."
                  exit 1
                }

                npm.cmd ci --no-fund
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "##vso[task.logissue type=error]npm ci failed with exit code $LASTEXITCODE."
                  exit $LASTEXITCODE
                }

          - task: PowerShell@2
            displayName: 'Audit Frontend npm Dependencies'
            condition: succeeded()
            inputs:
              targetType: 'inline'
              workingDirectory: 'ClientApp'
              failOnStderr: false
              script: |
                $ErrorActionPreference = 'Continue'
                $auditDir = Join-Path '$(Build.ArtifactStagingDirectory)' 'clientapp-npm-audit'
                New-Item -ItemType Directory -Path $auditDir -Force | Out-Null

                # Tier 1: Mandatory blocking production dependency check (--omit=dev)
                $prodAuditJsonPath = Join-Path $auditDir 'npm-audit-prod.json'
                npm.cmd audit --omit=dev --json > $prodAuditJsonPath
                $prodAuditExit = $LASTEXITCODE
                Write-Host "Production npm audit (--omit=dev) exited with code $prodAuditExit."

                $prodHighOrCrit = $false
                if (Test-Path $prodAuditJsonPath) {
                  try {
                    $prodParsed = Get-Content $prodAuditJsonPath -Raw | ConvertFrom-Json
                    if ($null -ne $prodParsed.metadata -and $null -ne $prodParsed.metadata.vulnerabilities) {
                      $pv = $prodParsed.metadata.vulnerabilities
                      Write-Host "Production npm vulnerability summary — critical=$($pv.critical), high=$($pv.high), moderate=$($pv.moderate), low=$($pv.low), info=$($pv.info)"
                      if ($pv.critical -gt 0 -or $pv.high -gt 0) {
                        $prodHighOrCrit = $true
                        Write-Host "##vso[task.logissue type=error]Production npm dependencies contain high/critical vulnerabilities (critical=$($pv.critical), high=$($pv.high))."
                      }
                    }
                    else {
                      $prodHighOrCrit = $true
                      Write-Host "##vso[task.logissue type=error]Production npm audit JSON lacked metadata.vulnerabilities."
                    }
                  }
                  catch {
                    $prodHighOrCrit = $true
                    Write-Host "##vso[task.logissue type=error]Unable to parse production npm audit JSON summary: $($_.Exception.Message)"
                  }
                }
                else {
                  $prodHighOrCrit = $true
                  Write-Host "##vso[task.logissue type=error]Production npm audit report was not generated at '$prodAuditJsonPath'."
                }

                # Tier 2: Full dependency audit report (all dependencies)
                $fullAuditJsonPath = Join-Path $auditDir 'npm-audit-full.json'
                npm.cmd audit --json > $fullAuditJsonPath
                $fullAuditExit = $LASTEXITCODE
                Write-Host "Full npm audit exited with code $fullAuditExit. Reports staged to clientapp-npm-audit."

                $fullCritical = $false
                if (Test-Path $fullAuditJsonPath) {
                  try {
                    $fullParsed = Get-Content $fullAuditJsonPath -Raw | ConvertFrom-Json
                    if ($null -ne $fullParsed.metadata -and $null -ne $fullParsed.metadata.vulnerabilities) {
                      $fv = $fullParsed.metadata.vulnerabilities
                      Write-Host "Full npm vulnerability summary — critical=$($fv.critical), high=$($fv.high), moderate=$($fv.moderate), low=$($fv.low), info=$($fv.info)"
                      if ($fv.critical -gt 0) {
                        $fullCritical = $true
                        Write-Host "##vso[task.logissue type=error]npm dependency graph contains critical vulnerabilities (critical=$($fv.critical))."
                      }
                      elseif ($fv.high -gt 0 -or $fv.moderate -gt 0) {
                        Write-Host "##vso[task.logissue type=warning]Dev/tooling npm dependencies contain advisories (high=$($fv.high), moderate=$($fv.moderate)). Review clientapp-npm-audit artifact."
                      }
                    }
                  }
                  catch {
                    Write-Host "##vso[task.logissue type=warning]Unable to parse full npm audit JSON summary: $($_.Exception.Message)"
                  }
                }

                if ($prodAuditExit -ne 0 -or $prodHighOrCrit -or $fullCritical) {
                  exit 1
                }
                exit 0

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Frontend npm Audit Report'
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/clientapp-npm-audit'
              artifact: 'clientapp-npm-audit'
              publishLocation: 'pipeline'

          - task: PowerShell@2
            displayName: 'Run ESLint (npm run lint)'
            inputs:
              targetType: 'inline'
              workingDirectory: 'ClientApp'
              failOnStderr: false
              script: |
                $ErrorActionPreference = 'Stop'
                npm.cmd run lint
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "##vso[task.logissue type=error]ESLint validation failed with exit code $LASTEXITCODE."
                  exit $LASTEXITCODE
                }

          - task: PowerShell@2
            displayName: 'Run TypeScript Validation (tsc -b)'
            inputs:
              targetType: 'inline'
              workingDirectory: 'ClientApp'
              failOnStderr: false
              script: |
                $ErrorActionPreference = 'Stop'
                npx.cmd --no-install tsc -b --pretty false
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "##vso[task.logissue type=error]TypeScript project-references check (tsc -b) failed with exit code $LASTEXITCODE."
                  exit $LASTEXITCODE
                }

          - task: PowerShell@2
            displayName: 'Run Frontend Unit Tests (Vitest)'
            inputs:
              targetType: 'inline'
              workingDirectory: 'ClientApp'
              failOnStderr: false
              script: |
                $ErrorActionPreference = 'Stop'
                New-Item -ItemType Directory -Path '$(frontendTestResultsDir)' -Force | Out-Null
                Write-Host '##vso[task.setvariable variable=VitestExecuted]true'
                npm.cmd run test -- --reporter=default --reporter=junit --outputFile="$(frontendTestResultsDir)/vitest-junit.xml"
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "##vso[task.logissue type=error]Vitest unit tests failed with exit code $LASTEXITCODE."
                  exit $LASTEXITCODE
                }

          - task: PublishTestResults@2
            displayName: 'Publish Vitest Unit Test Results'
            condition: and(succeededOrFailed(), eq(variables['VitestExecuted'], 'true'))
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'vitest-junit.xml'
              searchFolder: '$(frontendTestResultsDir)'
              testRunTitle: 'DVLD — ClientApp Vitest Unit Tests'
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: true
              publishRunAttachments: false

          - task: PowerShell@2
            displayName: 'Install Playwright Chromium Browser'
            inputs:
              targetType: 'inline'
              workingDirectory: 'ClientApp'
              failOnStderr: false
              script: |
                $ErrorActionPreference = 'Stop'
                npx.cmd --no-install playwright install chromium
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "##vso[task.logissue type=error]Playwright Chromium browser installation failed with exit code $LASTEXITCODE."
                  exit $LASTEXITCODE
                }

          - task: PowerShell@2
            displayName: 'Run Playwright E2E Tests (npm run test:e2e)'
            env:
              CI: 'true'
            inputs:
              targetType: 'inline'
              workingDirectory: 'ClientApp'
              failOnStderr: false
              script: |
                $ErrorActionPreference = 'Stop'
                Write-Host '##vso[task.setvariable variable=PlaywrightExecuted]true'
                npm.cmd run test:e2e
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "##vso[task.logissue type=error]Playwright E2E tests failed with exit code $LASTEXITCODE."
                  exit $LASTEXITCODE
                }

          - task: PublishTestResults@2
            displayName: 'Publish Playwright E2E Test Results'
            condition: and(succeededOrFailed(), eq(variables['PlaywrightExecuted'], 'true'))
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results/playwright-junit.xml'
              searchFolder: 'ClientApp'
              testRunTitle: 'DVLD — ClientApp Playwright E2E Tests'
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: true
              publishRunAttachments: true

          - task: PowerShell@2
            displayName: 'Stage Playwright Reports & Failure Diagnostics'
            condition: and(succeededOrFailed(), eq(variables['PlaywrightExecuted'], 'true'))
            inputs:
              targetType: 'inline'
              workingDirectory: 'ClientApp'
              failOnStderr: false
              script: |
                $pwOut = Join-Path '$(Build.ArtifactStagingDirectory)' 'playwright-artifacts'
                New-Item -ItemType Directory -Path $pwOut -Force | Out-Null
                if (Test-Path 'playwright-report') {
                  Copy-Item -Path 'playwright-report' -Destination (Join-Path $pwOut 'playwright-report') -Recurse -Force
                }
                if (Test-Path 'test-results') {
                  Copy-Item -Path 'test-results' -Destination (Join-Path $pwOut 'test-results') -Recurse -Force
                }
                Write-Host "##vso[task.setvariable variable=PlaywrightArtifactsStaged]true"

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Playwright Reports & Failure Diagnostics'
            condition: and(succeededOrFailed(), eq(variables['PlaywrightArtifactsStaged'], 'true'))
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/playwright-artifacts'
              artifact: 'clientapp-playwright-reports'
              publishLocation: 'pipeline'

          - task: PowerShell@2
            displayName: 'Build Production Bundle (vite build)'
            inputs:
              targetType: 'inline'
              workingDirectory: 'ClientApp'
              failOnStderr: false
              script: |
                $ErrorActionPreference = 'Stop'
                # TypeScript validation (tsc -b) already ran in the preceding step;
                # run Vite bundling directly here to avoid running tsc -b twice in CI.
                npx.cmd --no-install vite build
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "##vso[task.logissue type=error]ClientApp production bundle build failed with exit code $LASTEXITCODE."
                  exit $LASTEXITCODE
                }

                if (-not (Test-Path 'dist/index.html')) {
                  Write-Host "##vso[task.logissue type=error]Build exited 0 but ClientApp/dist/index.html was not produced."
                  exit 1
                }

          - task: PublishPipelineArtifact@1
            displayName: 'Publish ClientApp Production Bundle'
            condition: succeeded()
            inputs:
              targetPath: 'ClientApp/dist'
              artifact: 'clientapp-dist'
              publishLocation: 'pipeline'

          - task: PowerShell@2
            displayName: 'Collect Frontend Diagnostics on Failure'
            condition: failed()
            inputs:
              targetType: 'inline'
              failOnStderr: false
              script: |
                $diagDir = Join-Path '$(Build.ArtifactStagingDirectory)' 'clientapp-diagnostics'
                New-Item -ItemType Directory -Path $diagDir -Force | Out-Null

                @(
                  "BuildId=$(Build.BuildId)",
                  "NodeVersion=$(node --version 2>&1)",
                  "NpmVersion=$(npm.cmd --version 2>&1)"
                ) | Set-Content -Path (Join-Path $diagDir 'environment.txt')

                $npmLogs = Join-Path '$(npm_config_cache)' '_logs'
                if (Test-Path $npmLogs) {
                  Copy-Item -Path (Join-Path $npmLogs '*') -Destination $diagDir -Recurse -Force -ErrorAction SilentlyContinue
                }

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Frontend Failure Diagnostics'
            condition: failed()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/clientapp-diagnostics'
              artifact: 'clientapp-diagnostics'
              publishLocation: 'pipeline'

  # ===========================================================================
  # STAGE 2: BACKEND & SOLUTION VALIDATION — .NET 10 + SQL Server Integration
  # ===========================================================================
  - stage: Backend_CI
    displayName: 'Backend & Solution CI — .NET 10'
    dependsOn: []
    jobs:
      - job: Build_And_Test_Backend
        displayName: 'Restore, Build, Unit & SQL Integration Tests'
        # Microsoft-hosted agents have a 60-minute limit for private projects/repos
        # unless additional capacity is enabled. The previous 45-minute cap
        # canceled the backend job while Infrastructure Integration Tests were running.
        timeoutInMinutes: 60
        cancelTimeoutInMinutes: 5
        pool:
          vmImage: $(vmImageName)
        variables:
          # Scoped strictly to Backend_CI (Frontend_CI never receives backend secrets).
          - group: DVLD-Test-Secrets
          - name: NUGET_PACKAGES
            value: '$(Pipeline.Workspace)/.nuget/packages'
          - name: testResultsDirectory
            value: '$(Agent.TempDirectory)/TestResultsRaw'
          - name: publishedReportsDirectory
            value: '$(Agent.TempDirectory)/PublishedTestReports'
          - name: DOTNET_CLI_TELEMETRY_OPTOUT
            value: '1'
          - name: DOTNET_NOLOGO
            value: '1'
          - name: DOTNET_SKIP_FIRST_TIME_EXPERIENCE
            value: '1'
          # Dedicated run-specific LocalDB instance owned exclusively by this
          # (BuildId, JobAttempt) execution so residual cleanup never touches
          # unrelated or concurrent pipeline databases.
          - name: localDbInstanceName
            value: 'DVLD_CI_$(Build.BuildId)_$(System.JobAttempt)'
          - name: DVLD_TEST_CONNECTION
            value: 'Server=(localdb)\DVLD_CI_$(Build.BuildId)_$(System.JobAttempt);Initial Catalog=master;Integrated Security=true;TrustServerCertificate=true;Connection Timeout=30;'
        steps:
          - checkout: self
            clean: true
            fetchDepth: 1

          - task: UseDotNet@2
            displayName: 'Install .NET 10 SDK (from global.json)'
            inputs:
              packageType: 'sdk'
              useGlobalJson: true
              workingDirectory: '$(Build.SourcesDirectory)'

          # Verifies the active SDK matches the pinned .NET 10 LTS baseline from
          # global.json rather than falling back to an unrelated installed SDK.
          - task: PowerShell@2
            displayName: 'Report and Verify .NET 10 SDK Environment'
            inputs:
              targetType: 'inline'
              script: |
                $ErrorActionPreference = 'Stop'
                dotnet --info
                $sdkVer = (dotnet --version).Trim()
                Write-Host "Active dotnet --version: $sdkVer"
                if ($sdkVer -notmatch '^10\.') {
                  Write-Host "##vso[task.logissue type=error]Expected .NET 10 SDK per global.json, but resolved '$sdkVer'."
                  exit 1
                }
              failOnStderr: false

          - task: Cache@2
            displayName: 'Cache NuGet Packages'
            inputs:
              key: '"nuget" | "$(Agent.OS)" | global.json | **/*.csproj'
              restoreKeys: |
                "nuget" | "$(Agent.OS)" | global.json
                "nuget" | "$(Agent.OS)"
              path: '$(NUGET_PACKAGES)'

          - task: DotNetCoreCLI@2
            displayName: 'Restore Solution Dependencies'
            inputs:
              command: 'restore'
              projects: '$(solutionPath)'
              verbosityRestore: 'Minimal'

          - task: PowerShell@2
            displayName: 'Audit NuGet Package Vulnerabilities'
            condition: succeeded()
            inputs:
              targetType: 'inline'
              failOnStderr: false
              script: |
                $ErrorActionPreference = 'Continue'
                $nugetAuditDir = Join-Path '$(Build.ArtifactStagingDirectory)' 'backend-nuget-audit'
                New-Item -ItemType Directory -Path $nugetAuditDir -Force | Out-Null
                $reportPath = Join-Path $nugetAuditDir 'nuget-vulnerable.txt'
                dotnet list '$(solutionPath)' package --vulnerable --include-transitive | Tee-Object -FilePath $reportPath
                $nugetAuditExit = $LASTEXITCODE
                Write-Host "NuGet vulnerability report staged to backend-nuget-audit/nuget-vulnerable.txt."
                $reportText = if (Test-Path $reportPath) { Get-Content $reportPath -Raw } else { '' }
                if ($nugetAuditExit -ne 0 -or $reportText -match 'has the following vulnerable packages') {
                  Write-Host '##vso[task.logissue type=error]Vulnerable NuGet packages detected or vulnerability audit command failed. Review backend-nuget-audit/nuget-vulnerable.txt.'
                  exit 1
                }
                Write-Host 'Zero vulnerable NuGet packages detected across solution.'
                exit 0

          - task: PublishPipelineArtifact@1
            displayName: 'Publish NuGet Vulnerability Audit Report'
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/backend-nuget-audit'
              artifact: 'backend-nuget-audit'
              publishLocation: 'pipeline'

          - task: DotNetCoreCLI@2
            displayName: 'Build Solution ($(buildConfiguration))'
            inputs:
              command: 'build'
              projects: '$(solutionPath)'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: PowerShell@2
            displayName: 'Mark Solution Build Complete'
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "##vso[task.setvariable variable=SolutionBuilt]true"

          # -------------------------------------------------------------------
          # 1. Application Unit Tests (isolated, no SQL or JWT secrets injected)
          # -------------------------------------------------------------------
          - task: DotNetCoreCLI@2
            displayName: 'Run Application Unit Tests'
            condition: eq(variables['SolutionBuilt'], 'true')
            inputs:
              command: 'test'
              projects: '$(unitTestProject)'
              publishTestResults: false
              arguments: >-
                --configuration $(buildConfiguration)
                --no-build
                --logger "trx;LogFileName=Application.UnitTests.trx"
                --results-directory "$(testResultsDirectory)/Application.UnitTests"
                --collect:"XPlat Code Coverage"

          - task: PublishTestResults@2
            displayName: 'Publish Application Unit Test Results'
            condition: and(succeededOrFailed(), eq(variables['SolutionBuilt'], 'true'))
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: 'Application.UnitTests/Application.UnitTests.trx'
              searchFolder: '$(testResultsDirectory)'
              testRunTitle: 'DVLD — Application Unit Tests'
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: true
              publishRunAttachments: false

          # -------------------------------------------------------------------
          # 2. SQL Server LocalDB & Secret Prerequisite Verification
          # -------------------------------------------------------------------
          - task: PowerShell@2
            displayName: 'Initialize and Verify SQL Server Test Engine'
            condition: and(succeededOrFailed(), eq(variables['SolutionBuilt'], 'true'))
            env:
              DVLD_TEST_CONNECTION: '$(DVLD_TEST_CONNECTION)'
              EXPECTED_LOCALDB_INSTANCE: '$(localDbInstanceName)'
              BUILD_BUILDID: '$(Build.BuildId)'
              SYSTEM_JOBATTEMPT: '$(System.JobAttempt)'
            inputs:
              targetType: 'filePath'
              filePath: 'eng/scripts/Initialize-TestSqlEngine.ps1'
              failOnStderr: false

          # Fail fast if the initialization did not publish the identity contract.
          # Without this, integration suites cannot run against a verified isolated
          # engine and must never silently skip.
          - task: PowerShell@2
            displayName: 'Validate SQL Test Environment Contract'
            condition: and(succeededOrFailed(), eq(variables['SolutionBuilt'], 'true'))
            env:
              SQL_SERVER_READY: '$(SqlServerReady)'
              SQL_EXPECTED_INSTANCE: '$(SqlExpectedInstance)'
            inputs:
              targetType: 'inline'
              script: |
                $ErrorActionPreference = 'Stop'

                if ($env:SQL_SERVER_READY -ne 'true') {
                  Write-Host "##vso[task.logissue type=error]SQL Server test initialization did not succeed (SqlServerReady != true). Failing integration prerequisite gate."
                  exit 1
                }

                if ([string]::IsNullOrWhiteSpace($env:SQL_EXPECTED_INSTANCE) -or
                    $env:SQL_EXPECTED_INSTANCE -match '^\$' -or
                    $env:SQL_EXPECTED_INSTANCE -notmatch '^[^|]+\|[^|]+$') {
                  Write-Host "##vso[task.logissue type=error]SQL test environment contract is incomplete: SqlExpectedInstance was not published by initialization. Both integration suites require DVLD_TEST_EXPECTED_INSTANCE."
                  exit 1
                }

                Write-Host 'SQL test instance identity contract verified for both integration suites.'
              failOnStderr: false

          - task: PowerShell@2
            displayName: 'Validate API Integration Test Secrets'
            condition: and(succeededOrFailed(), eq(variables['SolutionBuilt'], 'true'))
            env:
              JWT_SECRET_CANDIDATE: '$(Jwt__SecretKey)'
            inputs:
              targetType: 'filePath'
              filePath: 'eng/scripts/Test-ApiSecretsPrerequisite.ps1'
              failOnStderr: false

          # -------------------------------------------------------------------
          # 3. API Integration Tests (requires SQL Server + Jwt__SecretKey)
          # -------------------------------------------------------------------
          - task: DotNetCoreCLI@2
            displayName: 'Run API Integration Tests'
            condition: >-
              and(
                succeededOrFailed(),
                eq(variables['SolutionBuilt'], 'true'),
                eq(variables['SqlServerReady'], 'true'),
                eq(variables['ApiPrerequisitesReady'], 'true')
              )
            env:
              DVLD_TEST_CONNECTION: '$(DVLD_TEST_CONNECTION)'
              DVLD_TEST_EXPECTED_INSTANCE: '$(SqlExpectedInstance)'
              Jwt__SecretKey: '$(Jwt__SecretKey)'
            inputs:
              command: 'test'
              projects: '$(apiIntegrationTestProject)'
              publishTestResults: false
              arguments: >-
                --configuration $(buildConfiguration)
                --no-build
                --logger "trx;LogFileName=API.IntegrationTests.trx"
                --results-directory "$(testResultsDirectory)/API.IntegrationTests"
                --collect:"XPlat Code Coverage"

          - task: PublishTestResults@2
            displayName: 'Publish API Integration Test Results'
            condition: >-
              and(
                succeededOrFailed(),
                eq(variables['SolutionBuilt'], 'true'),
                eq(variables['SqlServerReady'], 'true'),
                eq(variables['ApiPrerequisitesReady'], 'true')
              )
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: 'API.IntegrationTests/API.IntegrationTests.trx'
              searchFolder: '$(testResultsDirectory)'
              testRunTitle: 'DVLD — API Integration Tests'
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: true
              publishRunAttachments: false

          # -------------------------------------------------------------------
          # 4. Infrastructure Integration Tests (requires SQL Server only)
          # -------------------------------------------------------------------
          - task: DotNetCoreCLI@2
            displayName: 'Run Infrastructure Integration Tests'
            condition: >-
              and(
                succeededOrFailed(),
                eq(variables['SolutionBuilt'], 'true'),
                eq(variables['SqlServerReady'], 'true')
              )
            env:
              DVLD_TEST_CONNECTION: '$(DVLD_TEST_CONNECTION)'
              DVLD_TEST_EXPECTED_INSTANCE: '$(SqlExpectedInstance)'
            inputs:
              command: 'test'
              projects: '$(infraIntegrationTestProject)'
              publishTestResults: false
              arguments: >-
                --configuration $(buildConfiguration)
                --no-build
                --logger "trx;LogFileName=Infrastructure.IntegrationTests.trx"
                --results-directory "$(testResultsDirectory)/Infrastructure.IntegrationTests"
                --collect:"XPlat Code Coverage"

          - task: PublishTestResults@2
            displayName: 'Publish Infrastructure Integration Test Results'
            condition: >-
              and(
                succeededOrFailed(),
                eq(variables['SolutionBuilt'], 'true'),
                eq(variables['SqlServerReady'], 'true')
              )
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: 'Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.trx'
              searchFolder: '$(testResultsDirectory)'
              testRunTitle: 'DVLD — Infrastructure Integration Tests'
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: true
              publishRunAttachments: false

          # -------------------------------------------------------------------
          # 5. Ownership-Verified Cleanup of Ephemeral SQL Test Instance
          # -------------------------------------------------------------------
          - task: PowerShell@2
            displayName: 'Clean Up Run-Owned SQL Test Databases & LocalDB Instance'
            # Always attempt cleanup. The script itself refuses to delete anything
            # unless run ownership is positively verified, so this is safe even when
            # provisioning or tests fail before readiness.
            condition: always()
            env:
              DVLD_TEST_CONNECTION: '$(DVLD_TEST_CONNECTION)'
              SQL_PROBE_DATA_SOURCE: '$(SqlProbeDataSource)'
              SQL_EXCLUSIVE_INSTANCE_OWNED: '$(SqlExclusiveInstanceOwned)'
              SQL_OWNED_LOCALDB_INSTANCE: '$(SqlOwnedLocalDbInstance)'
              SQL_RUN_OWNERSHIP_TOKEN: '$(SqlRunOwnershipToken)'
            inputs:
              targetType: 'filePath'
              filePath: 'eng/scripts/Cleanup-TestSqlEngine.ps1'
              failOnStderr: false

          # -------------------------------------------------------------------
          # 6. Deduplicated Test/Coverage Staging, Publishing & CI Artifacts
          # -------------------------------------------------------------------
          - task: PowerShell@2
            displayName: 'Stage Deduplicated TRX & Cobertura Reports'
            condition: and(succeededOrFailed(), eq(variables['SolutionBuilt'], 'true'))
            env:
              TEST_RESULTS_DIRECTORY: '$(testResultsDirectory)'
              PUBLISHED_REPORTS_DIRECTORY: '$(publishedReportsDirectory)'
              SOLUTION_BUILT: '$(SolutionBuilt)'
              SQL_SERVER_READY: '$(SqlServerReady)'
              API_PREREQUISITES_READY: '$(ApiPrerequisitesReady)'
            inputs:
              targetType: 'filePath'
              filePath: 'eng/scripts/Stage-BackendTestReports.ps1'
              failOnStderr: false

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish Backend Code Coverage (Cobertura)'
            condition: and(succeededOrFailed(), eq(variables['CoverageReportsStaged'], 'true'))
            inputs:
              summaryFileLocation: '$(publishedReportsDirectory)/coverage/*.cobertura.xml'
              failIfCoverageEmpty: true

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Backend Test & Coverage Reports'
            condition: and(succeededOrFailed(), eq(variables['ReportsDirectoryReady'], 'true'))
            inputs:
              targetPath: '$(publishedReportsDirectory)'
              artifact: 'backend-test-and-coverage-reports'
              publishLocation: 'pipeline'

          - task: DotNetCoreCLI@2
            displayName: 'Package DVLD.Api Release Output'
            condition: succeeded()
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: '$(apiProjectPath)'
              arguments: '--configuration $(buildConfiguration) --no-build --output "$(Build.ArtifactStagingDirectory)/dvld-api"'
              zipAfterPublish: true

          - task: PublishPipelineArtifact@1
            displayName: 'Publish DVLD.Api Release Artifact'
            condition: succeeded()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/dvld-api'
              artifact: 'dvld-api-release'
              publishLocation: 'pipeline'
